name: Build and Release

on:
  pull_request:
    branches:
      - main
      - production
    types: [closed]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type (alpha or beta)'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta

jobs:
  build-and-release:
    # Run on merged PRs to production branch OR manual workflow dispatch
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'production') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install SDL2 dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Determine version type
        id: version_type
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
          else
            # Default to alpha for PR merges
            echo "type=alpha" >> $GITHUB_OUTPUT
          fi

      - name: Build all platforms
        run: |
          chmod +x build-production.sh
          ./build-production.sh ${{ steps.version_type.outputs.type }}

      - name: Get version
        id: version
        run: |
          VERSION=$(cat bin/VERSION.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RetroForge Engine v${{ steps.version.outputs.version }}
          body: |
            ## RetroForge Engine Release ${{ steps.version.outputs.version }}
            
            ### Downloads
            
            Binaries for all supported platforms:
            
            - **Linux (amd64)**: `retroforge-${{ steps.version.outputs.version }}`
            - **Linux (arm64)**: `retroforge-${{ steps.version.outputs.version }}-linux-arm64`
            - **Windows (amd64)**: `retroforge-${{ steps.version.outputs.version }}.exe`
            - **Windows (arm64)**: `retroforge-${{ steps.version.outputs.version }}-windows-arm64.exe`
            - **macOS (amd64)**: `retroforge-${{ steps.version.outputs.version }}-macos-amd64`
            - **macOS (arm64/Apple Silicon)**: `retroforge-${{ steps.version.outputs.version }}-macos-arm64`
            - **WebAssembly**: `retroforge-${{ steps.version.outputs.version }}.wasm`
            
            ### Installation
            
            Download the binary for your platform and make it executable (Linux/macOS):
            ```bash
            chmod +x retroforge-${{ steps.version.outputs.version }}-[platform]
            ```
            
            ### Usage
            
            ```bash
            ./retroforge-${{ steps.version.outputs.version }}-[platform] path/to/game.rf
            ```
          files: |
            bin/retroforge-*.wasm
            bin/retroforge-*.exe
            bin/retroforge-*
            bin/wasm_exec.js
            bin/VERSION.txt
          draft: false
          prerelease: ${{ steps.version_type.outputs.type == 'alpha' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

