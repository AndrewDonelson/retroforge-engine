name: Build and Release

on:
  pull_request:
    branches:
      - production
    types: [closed]
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type (alpha, beta, or prod)'
        required: true
        default: 'alpha'
        type: choice
        options:
          - alpha
          - beta
          - prod

jobs:
  # First job: Build on each platform natively
  build:
    # Run on merged PRs to production branch OR manual workflow dispatch
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'production') ||
      github.event_name == 'workflow_dispatch'
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: retroforge-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: retroforge-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: retroforge-windows-amd64.exe
          - os: windows-latest
            goos: windows
            goarch: arm64
            output: retroforge-windows-arm64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: retroforge-macos-amd64
            cgo: "1"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: retroforge-macos-arm64
            cgo: "1"
          - os: ubuntu-latest
            goos: js
            goarch: wasm
            output: retroforge.wasm
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          LDFLAGS="-s -w"
          if [ "${{ matrix.cgo }}" = "1" ]; then
            CGO_ENABLED=1 go build -ldflags "$LDFLAGS" -o ${{ matrix.output }} ./cmd/retroforge
          else
            go build -ldflags "$LDFLAGS" -o ${{ matrix.output }} ./cmd/retroforge
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  # Second job: Copy wasm_exec.js for WASM builds
  build-wasm-extras:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'production') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Copy wasm_exec.js
        run: |
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" .

      - name: Upload wasm_exec.js
        uses: actions/upload-artifact@v4
        with:
          name: wasm_exec.js
          path: wasm_exec.js

  # Third job: Create version file and release
  release:
    needs: [build, build-wasm-extras]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version type
        id: version_type
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
          else
            # Default to alpha for PR merges
            echo "type=alpha" >> $GITHUB_OUTPUT
          fi

      - name: Generate version
        id: version
        run: |
          # Get current date/time in format: YEAR.MM.DD.HHMM
          NOW=$(date -u +"%Y.%m.%d.%H%M")
          
          # Determine version type suffix
          VERSION_TYPE="${{ steps.version_type.outputs.type }}"
          if [ "$VERSION_TYPE" == "prod" ]; then
            VERSION="${NOW}"
          else
            VERSION="${NOW}-${VERSION_TYPE}"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"
          
          # Create VERSION.txt
          mkdir -p artifacts
          echo "$VERSION" > artifacts/VERSION.txt

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          # Move all binaries to root of artifacts directory
          find artifacts -type f -name "retroforge*" -exec mv {} artifacts/ \;
          find artifacts -type f -name "wasm_exec.js" -exec mv {} artifacts/ \;
          
          # Remove empty subdirectories
          find artifacts -type d -empty -delete
          
          # Rename binaries to include version
          cd artifacts
          for file in retroforge-*; do
            if [ -f "$file" ]; then
              # Extract platform from filename (e.g., "linux-amd64" from "retroforge-linux-amd64")
              platform="${file#retroforge-}"
              # Add version to filename
              mv "$file" "retroforge-${{ steps.version.outputs.version }}-${platform}"
            fi
          done
          
          # Handle the wasm file separately (no platform suffix)
          if [ -f "retroforge.wasm" ]; then
            mv "retroforge.wasm" "retroforge-${{ steps.version.outputs.version }}.wasm"
          fi
          
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RetroForge Engine v${{ steps.version.outputs.version }}
          body: |
            ## RetroForge Engine Release ${{ steps.version.outputs.version }}
            
            ### Downloads
            
            Binaries for all supported platforms:
            
            - **Linux (amd64)**: `retroforge-${{ steps.version.outputs.version }}-linux-amd64`
            - **Linux (arm64)**: `retroforge-${{ steps.version.outputs.version }}-linux-arm64`
            - **Windows (amd64)**: `retroforge-${{ steps.version.outputs.version }}-windows-amd64.exe`
            - **Windows (arm64)**: `retroforge-${{ steps.version.outputs.version }}-windows-arm64.exe`
            - **macOS (amd64)**: `retroforge-${{ steps.version.outputs.version }}-macos-amd64`
            - **macOS (arm64/Apple Silicon)**: `retroforge-${{ steps.version.outputs.version }}-macos-arm64`
            - **WebAssembly**: `retroforge-${{ steps.version.outputs.version }}.wasm`
            
            ### Installation
            
            Download the binary for your platform and make it executable (Linux/macOS):
            ```bash
            chmod +x retroforge-${{ steps.version.outputs.version }}-[platform]
            ```
            
            ### Usage
            
            ```bash
            ./retroforge-${{ steps.version.outputs.version }}-[platform] -cart path/to/game.rf -window
            ```
          files: |
            artifacts/*
          draft: false
          prerelease: ${{ steps.version_type.outputs.type != 'prod' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
